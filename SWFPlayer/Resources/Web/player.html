<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>SWF Player</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: #000; }
  #stage ruffle-player { display: block; width: 100%; height: 100%; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
</style>
<script>
  // MUST be defined before ruffle.js is parsed.
  window.RufflePlayer = window.RufflePlayer || {};

  var query = new URLSearchParams(window.location.search || "");
  var autoPlay = query.get("autoplay") !== "0";
  var startMuted = query.get("muted") === "1";

  window.RufflePlayer.config = {
    publicPath: "swfapp://localhost/Web/",
    // iOS 的 WebKit 上 wgpu/GLES 后端会在创建纹理时 panic
    // （"Unable to create texture object"），canvas 渲染器走 CPU 光栅化，稳定性优先。
    preferredRenderer: "canvas",
    polyfills: false,
    autoplay: autoPlay ? "on" : "off",
    unmuteOverlay: "hidden",
    backgroundColor: "#000000",
    wmode: "opaque",
    letterbox: "on",
    contextMenu: "off",
    menu: false,
    splashScreen: false,
    allowScriptAccess: false,
    allowNetworking: "internal",
    upgradeToHttps: false,
    quality: "high",
    scale: "showAll",
    logLevel: "error",
    warnOnUnsupportedContent: false,
    allowFullscreen: false,
    maxExecutionDuration: 30
  };
</script>
<script src="ruffle.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  "use strict";

  var player = null;
  var currentURL = null;
  var currentData = null;
  var currentName = null;
  var volumeValue = startMuted ? 0 : 1;
  var panicReported = false;
  // 可运行时切换的选项：HQ 画质与平铺（letterbox 关闭 = 拉伸铺满）。
  var options = { letterbox: "on", quality: "high" };

  function post(event, payload) {
    try {
      window.webkit.messageHandlers.bridge.postMessage({ event: event, payload: payload || null });
    } catch (e) { /* WebKit bridge unavailable */ }
  }

  function postPlayState(suspended) {
    post("state", { suspended: !!suspended });
  }

  function reportPanic(message) {
    if (panicReported) { return; }
    panicReported = true;
    post("panic", String(message || "renderer-panic"));
  }

  // Ruffle 的 wasm panic 会作为未捕获异常冒泡到 window，原生层据此展示可重试的错误界面。
  window.addEventListener("error", function (event) {
    var text = (event && event.message) ? String(event.message) : "";
    if (/panicked|wgpu|texture object|out of memory/i.test(text)) { reportPanic(text); }
  }, true);
  window.addEventListener("unhandledrejection", function (event) {
    var reason = event && event.reason;
    var text = String((reason && reason.message) ? reason.message : (reason || ""));
    if (/panicked|wgpu|texture object/i.test(text)) { reportPanic(text); }
  });

  // Ruffle 0.7.x exposes the API directly on the <ruffle-player> element;
  // older builds expose it through player.ruffle() (sometimes a Promise).
  function api() {
    if (!player) { return Promise.reject(new Error("player-not-created")); }
    var r = (typeof player.ruffle === "function") ? player.ruffle() : player;
    return Promise.resolve(r);
  }

  function run(fn) {
    Promise.resolve()
      .then(api)
      .then(fn)
      .catch(function (e) {
        post("error", String((e && e.message) ? e.message : e));
      });
  }

  function applyVolume(target) {
    try { target.volume = volumeValue; } catch (e) { /* not ready yet */ }
  }

  function createPlayer(attempt) {
    attempt = attempt || 0;
    var source = (window.RufflePlayer && typeof window.RufflePlayer.newest === "function")
      ? window.RufflePlayer.newest() : null;
    if (!source) {
      if (attempt < 40) {
        setTimeout(function () { createPlayer(attempt + 1); }, 100);
      } else {
        post("error", "ruffle-missing");
      }
      return;
    }

    try {
      player = source.createPlayer();
      player.setAttribute("id", "ruffle");
      document.getElementById("stage").appendChild(player);

      // Ruffle <ruffle-player> 在 panic 时会派发同名事件，兜底捕获一次。
      player.addEventListener("panic", function (event) {
        reportPanic(event && event.detail ? event.detail : "panic");
      });
      player.addEventListener("loadedmetadata", function () {
        api().then(function (a) { post("metadata", a.metadata || {}); }).catch(function () {});
      });
      player.addEventListener("loadeddata", function () { post("loaded", {}); });
      // Ruffle 自身状态（含影片自然结束、SWF 内部脚本暂停）也要同步给原生，
      // 这样播放/暂停图标始终反映真实状态，而不是只反映按钮点击。
      player.addEventListener("play", function () { postPlayState(false); });
      player.addEventListener("pause", function () { postPlayState(true); });

      applyVolume(player);
      post("ready", {});
    } catch (e) {
      post("error", String((e && e.message) ? e.message : e));
    }
  }

  function base64ToBytes(b64) {
    var raw = window.atob(b64);
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) { out[i] = raw.charCodeAt(i); }
    return out;
  }

  // Ruffle 的画质与 letterbox 只能在 load() 时生效，因此切换这两项会重载影片。
  function loadOptions() {
    return {
      autoplay: autoPlay ? "on" : "off",
      unmuteOverlay: "hidden",
      allowScriptAccess: false,
      letterbox: options.letterbox,
      quality: options.quality
    };
  }

  function reloadCurrent() {
    run(function (a) {
      var opts = loadOptions();
      if (currentData) {
        opts.data = currentData;
        opts.url = currentName || "movie.swf";
      } else if (currentURL) {
        opts.url = currentURL;
      } else {
        return null;
      }
      postPlayState(false);
      return a.load(opts);
    });
  }

  window.SWF = {
    load: function (url) {
      currentURL = url;
      currentData = null;
      currentName = null;
      run(function (a) {
        var opts = loadOptions();
        opts.url = url;
        return a.load(opts);
      });
    },

    // 兜底：若自定义 scheme 下的 fetch 被系统拦截，直接把字节交给 Ruffle。
    loadData: function (b64, name) {
      currentData = base64ToBytes(b64);
      currentName = name || "movie.swf";
      run(function (a) {
        var opts = loadOptions();
        opts.data = currentData;
        opts.url = currentName;
        return a.load(opts);
      });
    },

    play: function () {
      run(function (a) {
        if (typeof a.resume === "function") { a.resume(); }
        else if (typeof a.play === "function") { a.play(); }
        postPlayState(false);
      });
    },

    pause: function () {
      run(function (a) {
        if (typeof a.suspend === "function") { a.suspend(); }
        else if (typeof a.pause === "function") { a.pause(); }
        postPlayState(true);
      });
    },

    restart: function () {
      run(function (a) {
        if (currentData && typeof a.load === "function") {
          var opts = loadOptions();
          opts.data = currentData;
          opts.url = currentName || "movie.swf";
          return a.load(opts);
        }
        if (typeof a.reload === "function") { return a.reload(); }
        var fallback = loadOptions();
        fallback.url = currentURL;
        return a.load(fallback);
      });
    },

    setVolume: function (value) {
      volumeValue = Math.max(0, Math.min(1, Number(value)));
      run(function (a) { a.volume = volumeValue; });
    },

    // on = true 保持比例（上下留黑边视觉），false = 拉伸铺满。
    setLetterbox: function (on) {
      options.letterbox = on ? "on" : "off";
      reloadCurrent();
    },

    setQuality: function (level) {
      options.quality = String(level || "high");
      reloadCurrent();
    }
  };

  if (document.readyState === "complete" || document.readyState === "interactive") {
    setTimeout(function () { createPlayer(0); }, 0);
  } else {
    window.addEventListener("DOMContentLoaded", function () { createPlayer(0); });
  }
})();
</script>
</body>
</html>
